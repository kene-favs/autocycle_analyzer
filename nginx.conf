worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 10m;

    # ── HTTP → HTTPS redirect ────────────────────────────────────────────────
    server {
        listen 80;
        server_name autocycleai.duckdns.org;

        # Let win-acme renew certs via HTTP challenge
        location /.well-known/acme-challenge/ {
            root C:/nginx/html;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS ────────────────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name autocycleai.duckdns.org;

        ssl_certificate     C:/nginx/ssl/autocycleai.duckdns.org-chain.pem;
        ssl_certificate_key C:/nginx/ssl/autocycleai.duckdns.org-key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        proxy_read_timeout  120s;
        proxy_connect_timeout 10s;

        # ── Dashboard (analyzer — port 5000) ─────────────────────────────────
        # Redirect /platform → /platform/ so relative JS paths resolve correctly
        location = /platform {
            return 301 /platform/;
        }

        location /platform/ {
            proxy_pass         http://127.0.0.1:5000/;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # Analyzer API + static routes (called by dashboard JS using relative paths)
        location /api/ {
            proxy_pass         http://127.0.0.1:5000/api/;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location /internal/ {
            proxy_pass         http://127.0.0.1:5000/internal/;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location /static/ {
            proxy_pass         http://127.0.0.1:5000/static/;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location /auth/ {
            proxy_pass         http://127.0.0.1:5000/auth/;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location /sw.js {
            proxy_pass         http://127.0.0.1:5000/sw.js;
            proxy_set_header   Host $host;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location /manifest.json {
            proxy_pass         http://127.0.0.1:5000/manifest.json;
            proxy_set_header   Host $host;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ── Landing page + signals server (port 8000) — catch-all ────────────
        location / {
            proxy_pass         http://127.0.0.1:8000/;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }
}
